services:
  auth_db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: auth_db
    restart: on-failure #unless-stopped
    ports:
      - '1433:1433'
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    volumes:
      - auth_db_data:/var/opt/mssql

volumes:
  auth_db_data:
